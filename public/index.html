<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dawn Baton</title>
<style>
:root{--bg:#12124a;--panel:#1d1d63;--line:#6c6cff;--gold:#ffe066;--ink:#f2f2ff;--mute:#b9b9ff}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 "Trebuchet MS",Verdana,sans-serif}
main{max-width:440px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.bar{height:6px;background:linear-gradient(90deg,#ff5d5d,#ffb84d,#ffe066,#6be08a,#5dc8ff,#8a7bff,#ff7bd0)}
.p{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px 12px}
.h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 6px;font-weight:700}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.m{color:var(--mute);font-size:12px}
.sw{display:inline-block;width:60px;height:28px;border:1px solid #fff;border-radius:2px;padding:0;cursor:pointer}
.sw.on{outline:3px solid var(--gold)}
button,.chip{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:3px 8px;font-size:12px;cursor:pointer}
.chip.on,.tab.on{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700}
.go{background:var(--gold);color:var(--bg);border:0;border-radius:4px;padding:12px;font-weight:700;font-size:15px;width:100%}
.go:disabled{opacity:.4;cursor:default}
nav{display:flex;gap:6px}nav .tab{flex:1;padding:8px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{height:44px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;border:1px solid var(--line);color:var(--mute);background:var(--panel)}
.cell.open{background:var(--gold);color:var(--bg);font-weight:700}.cell.stamped,.cell.bot{background:#3a3a9a;color:var(--ink)}
.cell.unheld{background:#0b0b2b;border-style:dashed}.cell.mine{outline:3px solid #6be08a}
.grad{height:34px;border:2px solid #fff;margin:8px 0;display:flex}.grad i{flex:1}
#pv{position:sticky;top:0;z-index:5;background:#ffe066;color:#12124a;font-weight:700;text-align:center;padding:6px;font-size:12px}
#adm{position:fixed;left:0;right:0;bottom:0;background:#0b0b2b;border-top:2px solid var(--gold);padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:9}
.slot{margin:4px 0 10px}.strand{padding:6px 0;border-bottom:1px solid #3a3a9a}.strand.me{background:#2b2b8a;border:2px solid var(--gold);padding:6px 8px;border-radius:4px}
select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:3px}
</style></head><body><main>
<div id="pv" hidden>PREVIEW MODE: made-up screens. Nothing is sent or saved. Press X to close.</div>
<div class="bar"></div>
<div class="r" style="justify-content:space-between"><b style="font-size:20px">Dawn Baton</b><span class="m" id="lapno"></span></div>
<nav><button class="tab on" data-t="catch">Catch</button><button class="tab" data-t="payoff">Yesterday</button><button class="tab" data-t="planet">Planet</button><button class="tab" data-t="account">Account</button></nav>
<section id="catch"></section><section id="payoff" hidden></section><section id="planet" hidden></section><section id="account" hidden></section>
<footer class="m" id="ver" style="text-align:center;padding:8px 0 56px">Dawn Baton</footer>
</main>
<div id="adm" hidden></div>
<script>
const $ = (s) => document.querySelector(s);
const SKY = { clear: "Clear", cloud: "Overcast", fog: "Fog", drizzle: "Drizzle", rain: "Rain", snow: "Snow", storm: "Storm", unknown: "Unknown sky" };
const hsl = (c) => c == null ? "#0b0b2b" : `hsl(${c.hsl[0]},${c.hsl[1]}%,${c.hsl[2]}%)`;
const hm = (ms) => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cap = (s) => s[0].toUpperCase() + s.slice(1);
const NOTE_WORD = { resolve: "Settle", tension: "Lean" };   // what players see; the stored values stay resolve/tension
let palette = [], lists = { phrase: [], feeling: [], gesture: [], signoff: [] };
let pick = {}, isAdmin = false, PV = null, newCode = null, NAMES = { adj: [], noun: [] }, lapN = null, curTab = "catch";

// In preview mode nothing is sent: writes are refused on the spot, and screens read made-up data.
const api = async (p, body) => {
  if (PV && body) return { error: "Preview mode: nothing was sent." };
  if (PV) return {};
  return (await fetch("/api/" + p, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {})).json();
};

document.querySelectorAll(".tab").forEach((b) => b.onclick = () => show(b.dataset.t));
function show(t) {
  if (t === "payoff" && curTab !== "payoff") lapN = null;      // coming back to Yesterday starts at the latest lap again
  curTab = t;
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x.dataset.t === t));
  for (const id of ["catch", "payoff", "planet", "account"]) $("#" + id).hidden = id !== t;
  load(t);
}
async function load(which) {
  const fx = PV && PV.screen === which ? fixture(which, PV.scenario) : PV ? fixture(which, DEFAULT[which]) : null;
  if (which === "catch") return catchScreen(fx || await api("today"));
  if (which === "payoff") return payoffScreen(fx || await api("lap" + (lapN ? "?n=" + lapN : "")));
  if (which === "planet") return planetScreen(fx || await api("planet"));
  if (which === "account") return accountScreen(fx || await api("account"));
}

// ---------- catch ----------
function bandPicker(cur) {
  const here = Math.max(-11, Math.min(12, Math.round(-new Date().getTimezoneOffset() / 60)));
  let o = ""; for (let i = 12; i >= -11; i--) o += `<option value="${i}" ${i === (cur ?? here) ? "selected" : ""}>solar UTC${i >= 0 ? "+" : "-"}${Math.abs(i)}</option>`;
  return `<div class="r"><select id="off">${o}</select><button id="setband">${cur == null ? "That's my band" : "Change"}</button></div>`;
}
function wireBand() { const b = $("#setband"); if (b) b.onclick = async () => { const r = await api("band", { offset: +$("#off").value }); if (r.error) return alert(r.error); load("catch"); }; }

function sunLine(sun) {
  if (!sun) return "";
  if (sun.polar) return `<div class="m">${sun.polar === "day" ? "Polar day: the sun doesn't set today." : "Polar night: the sun doesn't rise today."}</div>`;
  const len = Math.round(sun.length / 1000), d = Math.round(Math.abs(sun.delta) / 1000);
  const delta = sun.delta == null ? "" : ` (${sun.delta >= 0 ? "+" : "&minus;"}${Math.floor(d / 60)}m ${String(d % 60).padStart(2, "0")}s since yesterday)`;
  return `<div class="m">Sunrise ${hm(sun.rise)} &middot; sunset ${hm(sun.set)} &middot; day length ${Math.floor(len / 3600)}h ${String(Math.floor(len / 60) % 60).padStart(2, "0")}m${delta}</div>`
    + (sun.event ? `<div style="color:var(--gold);margin-top:2px"><b>${cap(sun.event)} today.</b></div>` : "");
}

// Each slot asks a small question (the same for everyone, every day) so a choice has some context.
const ASK = {
  color: ["What color is your morning?"],
  note: ["Does the tune settle, or lean?"],
  phrase: ["Morning, sunshine ☀️"],
  feeling: ["Vibe check?"],
  gesture: ["You caught me…"],
  signoff: ["What are you bringing today?"],
};
const askHead = (k, first) => { const [q] = ASK[k]; return `<div style="margin-top:4px"><b>${k === "phrase" && first ? "Start the strand." : q}</b></div>${k === "phrase" && first ? `<div class="m">You're first this lap: any line will do.</div>` : ""}`; };
const SLOTS = [["phrase"], ["feeling"], ["gesture"], ["signoff"]];
const words = (st) => ({
  line: st.phrase != null ? lists.phrase[st.phrase] : null,
  extra: [st.feeling != null ? lists.feeling[st.feeling] : null, st.gesture != null ? lists.gesture[st.gesture] : null, st.signoff != null ? lists.signoff[st.signoff] : null].filter(Boolean),
});

function catchScreen(d) {
  if (d.version) $("#ver").textContent = "Dawn Baton v" + d.version;
  palette = d.palette; lists = d.lists || lists; $("#lapno").textContent = d.lap ? `Lap ${d.lap}` : "Not started";
  const el = $("#catch");
  if (!d.band) { el.innerHTML = `<div class="p"><p class="h">Find your band</p>${bandPicker(null)}</div>${sunLine(d.sun) ? `<div class="p"><p class="h">Today's sun</p>${sunLine(d.sun)}</div>` : ""}<div class="m">Played before? Use the Account tab to log in with a save code or passkey.</div>`; return wireBand(); }
  const w = d.window; let h = `<div class="p"><p class="h">Your dawn</p><div>${esc(d.band.label)}</div>`;
  if (!w.open) h += `<div class="m">Your window opens ${new Date(w.opensAt).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })} and stays open 2 hours.</div>`;
  else h += `<div class="m">Open until ${hm(w.closesAt)}.</div>` + (d.sky ? `<div style="margin-top:6px">Your sky (automatic): <b>${SKY[d.sky]}</b></div>` : "");
  h += sunLine(d.sun) ? `<div style="margin-top:6px">${sunLine(d.sun)}</div>` : "";
  h += `<div style="margin-top:8px">${bandPicker(d.band.offset)}</div></div>`;
  if (w.open && d.stamped) h += `<div class="p" style="border-color:#6be08a"><p class="h" style="color:#6be08a">Passed</p>You've passed the baton this lap. See how it ended tomorrow morning.</div>`;
  else if (w.open) {
    h += `<div class="p">`;
    if (d.prev) {
      const t = words(d.prev);
      h += `<div class="m" style="margin-bottom:4px">${d.prev.offset != null ? `<b style="color:var(--fg,#f2f2ff)">${d.prev.offset >= 0 ? "+" : "&minus;"}${Math.abs(d.prev.offset)}</b>` : ""}${d.prev.ago ? ` &middot; ${d.prev.ago}` : ""}</div>
        <div class="r" style="justify-content:space-between;flex-wrap:nowrap;align-items:center;gap:8px;min-height:30px"><div style="font-size:16px;line-height:1.2">${t.line ? `&ldquo;${esc(t.line)}&rdquo;` : ""}</div>
          <span style="display:flex;flex:none">${d.prev.sky ? skyIcon({ sky: d.prev.sky }, 30) : ""}</span></div>
        ${t.extra.length ? `<div class="r" style="margin-top:6px">${t.extra.map((w) => `<span class="chip" style="cursor:default">${esc(w)}</span>`).join("")}</div>` : ""}
        <div class="r" style="margin-top:8px;gap:10px"><span class="sw" style="cursor:default;width:60px;height:24px;${d.prev.color != null ? `background:${hsl(palette[d.prev.color])}` : "background:transparent;border:1px dashed #6c6cff"}"></span>
          <button id="hear" aria-label="Play the last notes" style="padding:3px 10px">&#9654;</button><span style="display:flex;gap:2px;align-items:center">${(d.heard || []).map((n) => noteIcon({ note: n }, 18)).join("")}</span></div>`;
    } else h += `<div class="m">Nobody has stamped yet this lap. You're first.</div>`;
    h += `</div><div class="p"><p class="h">Your stamp</p>${askHead("color")}<div class="r" style="gap:4px;margin:4px 0 10px">${palette.map((c, i) => `<button class="sw" data-k="color" data-v="${i}" title="${c.name}" style="background:${hsl(c)}"></button>`).join("")}</div>
      ${askHead("note")}<div class="r slot">${d.notes.map((n) => `<button class="chip" data-k="note" data-v="${n}">${NOTE_WORD[n] || cap(n)}</button>`).join("")}</div>
      ${SLOTS.map(([k]) => `${askHead(k, !d.prev)}<div class="r slot">${(lists[k] || []).map((t, i) => `<button class="chip" data-k="${k}" data-v="${i}">${esc(t)}</button>`).join("")}</div>`).join("")}</div>
      <button class="go" id="pass">Pass the baton west</button><div class="m" id="msg"></div>`;
  }
  el.innerHTML = h; wireBand(); pick = {};
  el.querySelectorAll("[data-k]").forEach((b) => b.onclick = () => {
    const k = b.dataset.k, v = k === "note" ? b.dataset.v : +b.dataset.v;
    pick[k] = pick[k] === v ? null : v;
    if (k === "note" && pick[k]) { stopSound(); tone(pick[k]); }          // hear the note you chose
    el.querySelectorAll(`[data-k="${k}"]`).forEach((x) => x.classList.toggle("on", pick[k] === (k === "note" ? x.dataset.v : +x.dataset.v)));
  });
  const hear = $("#hear"); if (hear) {
    const label = hear.innerHTML; let on = false;
    const done = () => { on = false; hear.innerHTML = label; };
    hear.onclick = () => {                                           // one note every 0.55 s; a silence is a rest; a second click stops
      if (on) { stopSound(); return done(); }
      stopSound(); on = true; hear.innerHTML = "&#9632;";
      const notes = d.heard && d.heard.length ? d.heard : [d.prev && d.prev.note];
      notes.forEach((n, i) => tone(n, i * 0.55, 0.5));
      tuneTimer = setTimeout(done, notes.length * 550 + 300);
    };
  }
  const pass = $("#pass"); if (pass) pass.onclick = async () => { pass.disabled = true; const r = await api("stamp", pick); if (r.error) { $("#msg").textContent = r.error; pass.disabled = false; } else load("catch"); };
}

// resolve = a note that settles, tension = one that leans. One shared audio context; every sound can be stopped.
let ac = null; const live = new Set(); let tuneTimer = null;
function ctxAudio() { try { ac = ac || new AudioContext(); if (ac.state === "suspended") ac.resume(); return ac; } catch { return null; } }
function tone(note, delay = 0, dur = 0.6) {
  const a = note && ctxAudio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + delay;
  o.frequency.value = note === "resolve" ? 329.6 : 493.9;     // settle = E4, lean = B4 (the note that leans toward home)
  g.gain.setValueAtTime(0.15, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  live.add(o); o.onended = () => live.delete(o);
}
function stopSound() { clearTimeout(tuneTimer); for (const o of live) { try { o.stop(); } catch {} } live.clear(); }

// ---------- yesterday ----------
// Small weather icons (inline SVG, 24 across, lined up with the 24 mood colors above them).
const ICON = {
  clear: '<circle cx="8" cy="8" r="3" fill="#ffe066"/><g stroke="#ffe066" stroke-width="1.2" stroke-linecap="round"><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3"/></g>',
  cloud: '<path d="M4.5 12h7a2.7 2.7 0 0 0 .3-5.4A3.6 3.6 0 0 0 5 5.9 3.1 3.1 0 0 0 4.5 12z" fill="#b9b9ff"/>',
  fog: '<g stroke="#b9b9ff" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 5h11M1.5 8h11M3.5 11h10"/></g>',
  drizzle: '<path d="M4.5 9h7a2.3 2.3 0 0 0 .2-4.6A3.2 3.2 0 0 0 5.2 4 2.7 2.7 0 0 0 4.5 9z" fill="#b9b9ff"/><g stroke="#5dc8ff" stroke-width="1.2" stroke-linecap="round"><path d="M6 11.2v1M9 11.5v1"/></g>',
  rain: '<path d="M4.5 8.5h7a2.3 2.3 0 0 0 .2-4.6A3.2 3.2 0 0 0 5.2 3.6 2.7 2.7 0 0 0 4.5 8.5z" fill="#8a9bd6"/><g stroke="#5dc8ff" stroke-width="1.4" stroke-linecap="round"><path d="M5.5 10.5l-.7 2.5M8.5 10.5l-.7 2.5M11.5 10.5l-.7 2.5"/></g>',
  snow: '<g stroke="#f2f2ff" stroke-width="1.2" stroke-linecap="round"><path d="M8 2v12M2.8 5l10.4 6M13.2 5L2.8 11"/></g>',
  storm: '<path d="M4.5 8h7a2.3 2.3 0 0 0 .2-4.6A3.2 3.2 0 0 0 5.2 3.1 2.7 2.7 0 0 0 4.5 8z" fill="#6c6cff"/><path d="M8.6 7.5L6.4 11h1.9l-.8 3.2 3-4.2H8.7z" fill="#ffe066"/>',
  unknown: '<circle cx="8" cy="8" r="1.4" fill="#6c6cff"/>',
};
// A cell with no mood color of its own: a very light pastel for the weather there. Real colors stay full strength.
// A cell with no mood color of its own is see-through, so the stars behind the bar show. Real colors stay full strength.
const cellBg = (st) => st.color != null ? hsl(palette[st.color]) : "transparent";
const skyIcon = (st, size = 14) => {
  if (st.kind === "gap" && !ICON[st.fillSky]) return `<svg viewBox="0 0 16 16" width="${size}" height="${size}"><path d="M4 8h8" stroke="#3a3a9a" stroke-width="1.2" stroke-dasharray="1.5 1.5"/></svg>`;
  const sky = st.kind === "gap" ? st.fillSky : st.sky;
  return `<svg viewBox="0 0 16 16" width="${size}" height="${size}"${st.kind === "gap" ? ' opacity=".55"' : ""}>${ICON[sky] || ICON.unknown}</svg>`;
};
const nextWindow = (n) => {
  if (n.open) return `Your window is open now, until ${hm(n.closesAt)}.`;
  const d = new Date(n.opensAt), today = new Date(), tomorrow = new Date(today.getTime() + 86400000);
  const day = d.toDateString() === today.toDateString() ? "today" : d.toDateString() === tomorrow.toDateString() ? "tomorrow" : d.toLocaleDateString([], { weekday: "long" });
  return `Your next window is ${day} at ${hm(n.opensAt)}.`;
};
// Note symbols: a music note for resolve, a flat sign for tension, a dash for silence (an unheld band gets a dimmer dash).
const NOTE_ICON = {
  resolve: '<ellipse cx="5.6" cy="12" rx="3" ry="2.2" transform="rotate(-20 5.6 12)" fill="#9fd0ff"/><path d="M8.4 11.6V2.6c.2 3.2 4.4 3.2 4.1 6.6" fill="none" stroke="#9fd0ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
  tension: '<path d="M5.4 1.8v11.6" stroke="#ff9f5d" stroke-width="1.5" stroke-linecap="round"/><path d="M5.4 13.4c0-4.4 6.6-5.2 6.6-1.6 0 2.2-3.2 2.8-6.6 1.6" fill="none" stroke="#ff9f5d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
  silence: '<path d="M3.5 8h9" stroke="#8a8aff" stroke-width="1.8" stroke-linecap="round"/>',
};
const noteIcon = (st, size = 14) => st.kind === "gap" ? `<svg viewBox="0 0 16 16" width="${size}" height="${size}"><path d="M3.5 8h9" stroke="#4a4aa0" stroke-width="1.8" stroke-linecap="round" opacity=".7"/></svg>`
  : `<svg viewBox="0 0 16 16" width="${size}" height="${size}">${NOTE_ICON[st.note || "silence"]}</svg>`;
const hms = (ms) => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
const inWindow = (st) => { const m = Math.max(0, Math.round((st.t * 1000 - st.opensAt) / 60000)); return m < 1 ? "as the window opened" : `${m} min into the window`; };
function strand(st, me) {
  const t = words(st);
  const when = st.t == null ? "" : st.bot ? `window closed ${hms(st.t * 1000)}` : `${hms(st.t * 1000)} &middot; ${inWindow(st)}`;
  const sky = SKY[st.sky] || "";
  return `<div class="strand${me ? " me" : ""}">
    <div class="r" style="justify-content:space-between;flex-wrap:nowrap;align-items:center;gap:8px;min-height:30px">
      <div style="font-size:16px;line-height:1.2">${t.line ? `&ldquo;${esc(t.line)}&rdquo;` : ""}</div>
      <span title="${esc(sky)}" aria-label="${esc(sky)}" style="display:flex;flex:none">${st.sky ? skyIcon(st, 30) : ""}</span></div>
    <div class="m" style="margin-top:2px">#${st.band + 1} &middot; ${esc(st.label)}${st.name ? " &middot; " + esc(st.name) : ""}${st.bot ? " &middot; bot" : ""}${me ? " &middot; you" : ""}</div>
    ${when ? `<div class="m">${when}</div>` : ""}
    <div class="r" style="margin-top:4px"><span class="sw" style="cursor:default;width:60px;height:24px;${st.color != null ? `background:${hsl(palette[st.color])}` : "background:transparent;border:1px dashed #6c6cff"}"></span>${[st.note ? (NOTE_WORD[st.note] || cap(st.note)) : null, ...t.extra].filter(Boolean).map((w) => `<span class="chip" style="cursor:default">${esc(w)}</span>`).join("")}</div></div>`;
}
function payoffScreen(l) {
  const el = $("#payoff");
  if (l.error) { el.innerHTML = `<div class="p"><p class="h">Yesterday's lap</p><div class="m">No finished lap yet. The first one closes about 25 hours after launch.</div></div>`; return; }
  $("#lapno").textContent = `Lap ${l.lap}`;
  const me = l.yours, held = l.stamps.filter((x) => x.kind === "stamp"), shown = held.filter((x) => x.phrase != null || x.mine);
  const nav = `<div class="r" style="justify-content:space-between;flex-wrap:nowrap"><button id="lprev" ${l.lap <= l.first ? "disabled" : ""} aria-label="Earlier lap">&#9664;</button>
    <div style="text-align:center"><b>Lap ${l.lap}</b><div class="m">${new Date(l.startsAt).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" })}</div></div>
    <button id="lnext" ${l.lap >= l.last ? "disabled" : ""} aria-label="Later lap">&#9654;</button></div>`;
  el.innerHTML = `<div class="p">${nav}</div><div class="p"><p class="h">The lap</p><div class="r" style="height:34px;margin:8px 0;border:2px solid #fff;gap:0;flex-wrap:nowrap">${l.stamps.map((st) => `<i style="flex:1;height:100%;background:${cellBg(st)}"></i>`).join("")}</div><div class="r" style="gap:0;flex-wrap:nowrap;margin-top:4px">${l.stamps.map((st) => `<span title="${esc(st.label)}: ${st.kind === "gap" ? "unheld, weather nearby: " + (SKY[st.fillSky] || "unknown") : (SKY[st.sky] || "?")}" style="flex:1;display:flex;justify-content:center">${skyIcon(st)}</span>`).join("")}</div>
    
    <div class="r" style="gap:0;flex-wrap:nowrap;margin-top:2px">${l.stamps.map((st) => `<span title="${esc(st.label)}: ${st.kind === "gap" ? "unheld" : (NOTE_WORD[st.note] || "silence").toLowerCase()}" style="flex:1;display:flex;justify-content:center">${noteIcon(st)}</span>`).join("")}</div>
    <div class="r" style="margin-top:8px"><button id="tune">Play the tune</button><span class="m" style="display:flex;gap:10px;align-items:center"><span style="display:flex;gap:3px;align-items:center">${noteIcon({ note: "resolve" })} settle</span><span style="display:flex;gap:3px;align-items:center">${noteIcon({ note: "tension" })} lean</span><span style="display:flex;gap:3px;align-items:center">${noteIcon({})} silent</span></span></div>
    </div>
    ${!me && l.next ? `<div class="p"><div>You didn't catch the baton this lap.</div><div class="m" style="margin-top:2px">${nextWindow(l.next)}</div></div>` : ""}
    ${me ? `<div class="p" style="border-color:var(--gold)"><p class="h">Your stamp, ${esc(me.label)}</p>${strand(me, false).replace('class="strand"', 'class="strand" style="border:0;padding:0"')}<div class="m" style="margin-top:4px">Proof: fingerprint ${me.hash.slice(0, 4)}&hellip;${me.hash.slice(-4)}</div></div>` : ""}
    <div class="p"><p class="h">The strand</p><div id="sl">${shown.slice(0, 6).map((x) => strand(x, x.mine)).join("") || '<div class="m">No phrases this lap.</div>'}</div>
      ${shown.length > 6 ? `<button id="more" style="margin-top:6px">Show all ${shown.length}</button>` : ""}</div>`;
  $("#lprev").onclick = () => { stopSound(); lapN = l.lap - 1; load("payoff"); };
  $("#lnext").onclick = () => { stopSound(); lapN = l.lap + 1 >= l.last ? null : l.lap + 1; load("payoff"); };
  const tb = $("#tune"); let playing = false;
  const idle = () => { playing = false; tb.textContent = "Play the tune"; };
  tb.onclick = () => {                                              // a second click stops it
    if (playing) { stopSound(); return idle(); }
    stopSound(); playing = true; tb.textContent = "Stop the tune";
    l.tune.forEach((n, i) => tone(n, i * 0.25, 0.4));
    tuneTimer = setTimeout(idle, l.tune.length * 250 + 300);
  };
  const more = $("#more"); if (more) more.onclick = () => { $("#sl").innerHTML = shown.map((x) => strand(x, x.mine)).join(""); more.remove(); };
}

// ---------- planet ----------
function planetScreen(p) {
  const el = $("#planet");
  if (!p.bands || !p.bands.length) { el.innerHTML = `<div class="p"><p class="h">The planet</p><div class="m">The first lap hasn't started.</div></div>`; return; }
  $("#lapno").textContent = `Lap ${p.lap}`;
  const n = (s) => p.bands.filter((b) => b.status === s).length;
  el.innerHTML = `<div class="p"><p class="h">The baton right now</p><div class="m">${n("stamped") + n("bot")} of 24 bands have stamped &middot; ${n("unheld")} unheld so far</div></div>
    <div class="p"><p class="h">24 solar bands</p><div class="grid">${p.bands.map((b) => `<div class="cell ${b.status}${b.mine ? " mine" : ""}" title="${b.status}">${b.label.replace("solar UTC", "")}</div>`).join("")}</div>
    <div class="m" style="margin-top:8px">Yellow: open now &middot; blue: stamped &middot; dark: unheld &middot; green outline: you</div></div>`;
}

// ---------- account: save codes and passkeys ----------
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64 = (t) => { t = t.replace(/-/g, "+").replace(/_/g, "/"); return Uint8Array.from(atob(t + "===".slice((t.length + 3) % 4)), (c) => c.charCodeAt(0)); };
const pkOk = () => !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
const day = (s) => new Date(s * 1000).toLocaleDateString([], { month: "short", day: "numeric" });
function accountScreen(a) {
  const el = $("#account"), has = a.codes.length || a.passkeys.length;
  el.innerHTML = `<div class="p"><p class="h">Your player</p>
    <div class="m">${a.player ? `Saved on ${a.devices} device${a.devices > 1 ? "s" : ""}.` : "No player yet. Pick a band on the Catch tab, or log in below."} Either of these brings your player, band and stamps to another browser or device.</div></div>
    <div class="p"><p class="h">Your name</p>
      <div style="font-size:16px;margin-bottom:6px">${a.name ? `<b>${esc(a.name.text)}</b>` : '<span class="m">No name yet. You stamp as a stranger.</span>'}</div>
      <div class="r"><button id="nshuffle">Shuffle</button></div>
      <label class="m" style="display:block;margin-top:8px"><input type="checkbox" id="nsigns" ${a.signs !== false ? "checked" : ""}> Show my name on my stamps (only after the lap is over)</label></div>
    ${newCode ? `<div class="p" style="border-color:var(--gold)"><p class="h">Your new save code (shown once)</p><div style="font:700 17px monospace;letter-spacing:.04em;word-break:break-all">${newCode}</div><div class="m" style="margin-top:4px">Write it down or save it somewhere safe. We only keep a fingerprint of it.</div><div style="margin-top:8px"><button id="dlcode">Download as a text file</button></div></div>` : ""}
    <div class="p"><p class="h">Save codes (${a.codes.length}/5)</p><div class="m" style="margin-bottom:6px">A code you write down or keep in a file. It works on any browser.</div>
      ${a.codes.map((c) => `<div class="r" style="margin-bottom:4px"><span class="m">made ${day(c.created_at)}${c.last_used_at ? " · used " + day(c.last_used_at) : ""}</span><button data-rm="codes" data-id="${c.id}">Forget</button></div>`).join("") || '<div class="m">None yet.</div>'}
      <div style="margin-top:6px"><button id="mkcode">Make a save code</button></div></div>
    <div class="p"><p class="h">Passkeys (${a.passkeys.length})</p><div class="m" style="margin-bottom:6px">Log in with your fingerprint, face or device PIN. Nothing to write down.</div>
      ${a.passkeys.map((k) => `<div class="r" style="margin-bottom:4px"><span class="m">${esc(k.label || "passkey")} · made ${day(k.created_at)}</span><button data-rm="passkey" data-id="${k.id}">Forget</button></div>`).join("") || '<div class="m">None yet.</div>'}
      <div style="margin-top:6px">${pkOk() ? '<button id="mkpk">Add a passkey</button>' : '<span class="m">This browser can\'t do passkeys. Use a save code instead.</span>'}</div></div>
    <div class="p"><p class="h">Log in on this device</p><div class="m" style="margin-bottom:4px">With a save code:</div>
      <div class="r"><input id="code" placeholder="K7QM-2XPA-9RTD-HV4C-8NBE" style="font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:4px 6px;flex:1;min-width:180px"><button id="uc">Use code</button></div>
      ${pkOk() ? '<div class="m" style="margin:8px 0 4px">Or with a passkey:</div><div><button id="up">Log in with a passkey</button></div>' : ""}</div>
    ${has ? '<button id="out" style="align-self:flex-start">Log out of this browser</button>' : ""}
    <div class="m" id="amsg"></div>`;
  const say = (t) => { $("#amsg").textContent = t; };
  const done = (msg) => { newCode = null; load("account"); load("catch"); if (msg) setTimeout(() => say(msg), 200); };
  const sel = (id) => $("#" + id);
  sel("nshuffle").onclick = async () => {                             // a random free pair, saved right away
    const A = a.names.adj || [], N = a.names.noun || [], signs = sel("nsigns").checked;
    let r = await api("name", { a: "adj:" + Math.floor(Math.random() * A.length), b: "noun:" + Math.floor(Math.random() * N.length), signs });
    if (r.suggestion) r = await api("name", { a: r.suggestion.a, b: r.suggestion.b, signs });
    if (r.error) return say(r.error);
    load("account");
  };
  sel("nsigns").onchange = async () => { const r = await api("name", { signs: sel("nsigns").checked }); if (r.error) say(r.error); };
  const dl = $("#dlcode"); if (dl) dl.onclick = () => {
    const text = `Dawn Baton save code\n\n${newCode}\n\nGo to ${location.origin}, open the Account tab, and paste this code under "Log in on this device" to play as your player on any browser.\nKeep this file private: anyone with the code can log in as you.\n`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
    a.download = "dawn-baton-save-code.txt"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const mk = $("#mkcode"); if (mk) mk.onclick = async () => { const r = await api("codes", { action: "new" }); if (r.error) return say(r.error); newCode = r.code; load("account"); };
  el.querySelectorAll("[data-rm]").forEach((b) => b.onclick = async () => { const r = await api(b.dataset.rm, { action: "remove", id: +b.dataset.id }); if (r.error) say(r.error); else load("account"); });
  $("#uc").onclick = async () => { const r = await api("load", { code: $("#code").value }); if (r.error) return say(r.error); done("Logged in."); };
  const out = $("#out"); if (out) out.onclick = async () => { const r = await api("logout", {}); if (r.error) return say(r.error); done("Logged out."); };
  const mp = $("#mkpk"); if (mp) mp.onclick = async () => {
    if (PV) return say("Preview mode: nothing was sent.");
    try {
      say("Waiting for your fingerprint, face or PIN...");
      const o = await api("passkey", { action: "register_options" }); if (o.error) return say(o.error);
      const cred = await navigator.credentials.create({ publicKey: { ...o, challenge: unb64(o.challenge), user: { ...o.user, id: unb64(o.user.id) }, excludeCredentials: o.excludeCredentials.map((c) => ({ ...c, id: unb64(c.id) })) } });
      const ua = navigator.userAgent;
      const r = await api("passkey", { action: "register", label: /Android/.test(ua) ? "Android" : /iPhone|iPad/.test(ua) ? "iPhone" : /Mac/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows PC" : "This device",
        credential: { id: cred.id, response: { clientDataJSON: b64(cred.response.clientDataJSON), attestationObject: b64(cred.response.attestationObject) } } });
      if (r.error) return say(r.error);
      load("account"); setTimeout(() => say("Passkey added."), 200);
    } catch (e) { say(e && e.name === "NotAllowedError" ? "Passkey cancelled (or it timed out)." : (e && e.message) || "The passkey didn't work."); }
  };
  const up = $("#up"); if (up) up.onclick = async () => {
    if (PV) return say("Preview mode: nothing was sent.");
    try {
      say("Waiting for your passkey...");
      const o = await api("passkey", { action: "login_options" }); if (o.error) return say(o.error);
      const cred = await navigator.credentials.get({ publicKey: { ...o, challenge: unb64(o.challenge) } });
      const r = await api("passkey", { action: "login", credential: { id: cred.id, response: { clientDataJSON: b64(cred.response.clientDataJSON), authenticatorData: b64(cred.response.authenticatorData), signature: b64(cred.response.signature) } } });
      if (r.error) return say(r.error);
      done("Logged in.");
    } catch (e) { say(e && e.name === "NotAllowedError" ? "Passkey cancelled (or it timed out)." : (e && e.message) || "The passkey didn't work."); }
  };
}

// ---------- admin: preview every screen with made-up data (X key) ----------
// Reads nothing from the game and writes nothing: in preview, api() refuses every write.
const SCENARIOS = {
  catch: { nobands: "No band yet", waiting: "Waiting for dawn", open: "Open, with a line before", first: "Open, you're first", stamped: "Already passed", equinox: "Open, equinox day", polar: "Open, polar night" },
  payoff: { full: "A full lap", sparse: "Mostly unheld", missed: "You missed it", none: "No finished lap yet" },
  planet: { mid: "Mid-lap", start: "Lap just started", end: "Last bands", none: "Not started" },
  account: { fresh: "New player", saved: "Codes and a passkey", justmade: "Just made a code" },
};
const DEFAULT = { catch: "open", payoff: "full", planet: "mid", account: "saved" };
let seed = 7; const rnd = (n) => (seed = (seed * 16807) % 2147483647) % n;
const bandInfo = (i) => ({ index: i, offset: 12 - i, label: `solar UTC${12 - i >= 0 ? "+" : "-"}${Math.abs(12 - i)}` });

function fixture(which, scn) {
  const now = Date.now(), H = 3600000, at = (h, m) => { const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime(); };
  if (which === "catch") {
    const sun = { rise: at(6, 12), set: at(17, 36), length: 11 * H + 24 * 60000, polar: null, delta: -130000, event: null };
    const base = { now, lap: 118, palette, notes: ["resolve", "tension"], lists, sun, lastClosedLap: 117, band: bandInfo(3), stamped: false, sky: "rain",
      window: { lap: 118, open: true, opensAt: now - H / 2, closesAt: now + 1.5 * H },
      prev: { color: 6, note: "tension", sky: "clear", phrase: 3, feeling: 1, gesture: 6, signoff: 2, offset: 9, ago: "a while ago" }, heard: ["resolve", null, "tension"] };
    return {
      nobands: { ...base, band: null, window: null, prev: null, sky: null },
      waiting: { ...base, window: { lap: 118, open: false, opensAt: now + 5 * H, closesAt: now + 7 * H }, prev: null, sky: null },
      open: base, first: { ...base, prev: null, heard: [] }, stamped: { ...base, stamped: true, prev: null, sky: null },
      equinox: { ...base, sun: { ...sun, event: "equinox", delta: 12000 } },
      polar: { ...base, sun: { rise: null, set: null, length: 0, polar: "night", delta: null, event: null } },
    }[scn];
  }
  if (which === "payoff") {
    if (scn === "none") return { error: "none" };
    const lapNo = lapN || 117; seed = 11 + lapNo; const sparse = scn === "sparse", stamps = [];
    for (let i = 0; i < 24; i++) {
      if (sparse && i % 3 !== 0) { stamps.push({ band: i, label: bandInfo(i).label, kind: "gap", bot: false, color: null, note: null, phrase: null, feeling: null, gesture: null, signoff: null, sky: null, fillSky: ["clear", "cloud", "rain", "fog", "snow", "drizzle", "storm"][rnd(7)], t: null, opensAt: Date.now() - 86400000 + i * 3600000, mine: false, hash: "0".repeat(64) }); continue; }
      const bot = i % 4 === 1;
      const blank = i % 9 === 5;
      stamps.push({ band: i, label: bandInfo(i).label, kind: "stamp", bot, color: blank ? (rnd(12), null) : rnd(12), fillSky: blank ? "rain" : undefined, note: rnd(9) ? ["resolve", "tension"][rnd(2)] : null,
        phrase: rnd(4) ? rnd(lists.phrase.length || 1) : null, feeling: rnd(3) ? rnd(lists.feeling.length || 1) : null, gesture: rnd(3) ? rnd(lists.gesture.length || 1) : null,
        signoff: rnd(3) ? rnd(lists.signoff.length || 1) : null, name: !bot && rnd(2) ? `${NAMES.adj[rnd(NAMES.adj.length || 1)] || "Quiet"} ${NAMES.noun[rnd(NAMES.noun.length || 1)] || "Heron"}` : null, sky: bot ? "unknown" : ["clear", "cloud", "rain", "fog", "snow", "drizzle", "storm"][rnd(7)], t: Math.floor(Date.now() / 1000) - 86400 + i * 3600 + rnd(7200), opensAt: Date.now() - 86400000 + i * 3600000, mine: scn !== "missed" && i === 18, hash: "9f2c" + "a".repeat(56) + "a71e" });
    }
    const items = stamps, st = items.filter((x) => x.kind === "stamp");
    return { next: { open: false, opensAt: at(6, 12) + 86400000, closesAt: at(8, 12) + 86400000 }, lap: lapNo, first: 1, last: 117, startsAt: Date.now() - 86400000 * (118 - lapNo), held: st.filter((x) => !x.bot).length, bots: st.filter((x) => x.bot).length, unheld: items.length - st.length, gradient: items.map((x) => x.color), tune: items.map((x) => x.note),
      tally: { resolve: st.filter((x) => x.note === "resolve").length, tension: st.filter((x) => x.note === "tension").length, silent: items.filter((x) => x.note == null).length },
      sky: st.reduce((a, x) => (a[x.sky] = (a[x.sky] || 0) + 1, a), {}), stamps: items, yours: items.find((x) => x.mine) || null };
  }
  if (which === "planet") {
    if (scn === "none") return { lap: 0, bands: [] };
    const k = { mid: 11, start: 0, end: 23 }[scn], bands = [];
    for (let i = 0; i < 24; i++) bands.push({ band: i, label: bandInfo(i).label, status: i < k ? (i % 7 === 5 ? "unheld" : i % 4 === 1 ? "bot" : "stamped") : i === k ? "open" : "waiting", mine: i === 18 });
    return { lap: 118, bands };
  }
  if (which === "account") {
    const t = Math.floor(Date.now() / 1000);
    if (scn === "fresh") { newCode = null; return { player: false, admin: true, codes: [], passkeys: [], devices: 0, name: null, names: NAMES, signs: true }; }
    if (scn === "justmade") newCode = "K7QM-2XPA-9RTD-HV4C-8NBE"; else newCode = null;
    const nm = { a: "adj:0", b: "noun:0", text: `${NAMES.adj[0] || "Quiet"} ${NAMES.noun[0] || "Heron"}` };
    return { player: true, admin: true, name: nm, names: NAMES, signs: true, codes: [{ id: 1, created_at: t - 86400 * 3, last_used_at: t - 3600 }], passkeys: [{ id: 1, label: "Windows PC", created_at: t - 86400 * 3, last_used_at: null }], devices: 2 };
  }
}

function adminPanel() {
  const bar = $("#adm");
  if (!isAdmin) return;
  if (!bar.hidden) { bar.hidden = true; PV = null; newCode = null; $("#pv").hidden = true; return show(document.querySelector(".tab.on").dataset.t); }
  const cur = document.querySelector(".tab.on").dataset.t;
  const opts = Object.entries(SCENARIOS).map(([k, m]) => `<optgroup label="${cap(k)}">${Object.entries(m).map(([id, name]) => `<option value="${k}:${id}">${name}</option>`).join("")}</optgroup>`).join("");
  bar.innerHTML = `<b style="color:var(--gold)">ADMIN</b><select id="pvs">${opts}</select><span class="m">Made-up screens, nothing sent. X closes.</span>`;
  bar.hidden = false; $("#pv").hidden = false;
  const sel = $("#pvs"), go = () => { const [screen, scenario] = sel.value.split(":"); PV = { screen, scenario }; show(screen); };
  sel.value = `${cur}:${DEFAULT[cur]}`; sel.onchange = go; go();
}
document.addEventListener("keydown", (e) => {
  if (e.key.toLowerCase() !== "x" || e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || "")) return;
  adminPanel();
});

load("catch");
fetch("/api/account").then((r) => r.json()).then((a) => { isAdmin = !!a.admin; if (a.names) NAMES = a.names; }).catch(() => {});
</script></body></html>
