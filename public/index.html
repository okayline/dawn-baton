<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Band Baton</title>
<style>
:root{--bg:#12124a;--panel:#1d1d63;--line:#6c6cff;--gold:#ffe066;--ink:#f2f2ff;--mute:#b9b9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 "Trebuchet MS",Verdana,sans-serif}
main{max-width:440px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.bar{height:6px;background:linear-gradient(90deg,#ff5d5d,#ffb84d,#ffe066,#6be08a,#5dc8ff,#8a7bff,#ff7bd0)}
.p{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px 12px}
.h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 6px;font-weight:700}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.m{color:var(--mute);font-size:12px}
.sw{display:inline-block;width:60px;height:28px;border:1px solid #fff;border-radius:2px;padding:0;cursor:pointer}
.sw.on{outline:3px solid var(--gold)}
button,.chip{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:3px 8px;font-size:12px;cursor:pointer}
.chip.on,.tab.on{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700}
.go{background:var(--gold);color:var(--bg);border:0;border-radius:4px;padding:12px;font-weight:700;font-size:15px;width:100%}
.go:disabled{opacity:.4;cursor:default}
nav{display:flex;gap:6px}nav .tab{flex:1;padding:8px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{height:44px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;border:1px solid var(--line);color:var(--mute);background:var(--panel)}
.cell.open{background:var(--gold);color:var(--bg);font-weight:700}.cell.stamped,.cell.bot{background:#3a3a9a;color:var(--ink)}
.cell.unheld{background:#0b0b2b;border-style:dashed}.cell.mine{outline:3px solid #6be08a}
.grad{height:34px;border:2px solid #fff;margin:8px 0;display:flex}.grad i{flex:1}
select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:3px}
</style></head><body><main>
<div class="bar"></div>
<div class="r" style="justify-content:space-between"><b style="font-size:20px">Band Baton</b><span class="m" id="lapno"></span></div>
<nav><button class="tab on" data-t="catch">Catch</button><button class="tab" data-t="payoff">Yesterday</button><button class="tab" data-t="planet">Planet</button></nav>
<section id="catch"></section><section id="payoff" hidden></section><section id="planet" hidden></section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const api = async (p, body) => (await fetch("/api/" + p, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {})).json();
const hsl = (c) => c == null ? "#0b0b2b" : `hsl(${c.hsl[0]},${c.hsl[1]}%,${c.hsl[2]}%)`;
const SKY = { clear: "Clear", cloud: "Overcast", fog: "Fog", drizzle: "Drizzle", rain: "Rain", snow: "Snow", storm: "Storm", unknown: "Unknown sky" };
const hm = (ms) => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let palette = [], pick = { color: null, note: null };

document.querySelectorAll(".tab").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b));
  for (const id of ["catch", "payoff", "planet"]) $("#" + id).hidden = id !== b.dataset.t;
  load(b.dataset.t);
});

function bandPicker(cur) {
  const here = Math.max(-11, Math.min(12, Math.round(-new Date().getTimezoneOffset() / 60)));
  let o = ""; for (let i = 12; i >= -11; i--) o += `<option value="${i}" ${i === (cur ?? here) ? "selected" : ""}>solar UTC${i >= 0 ? "+" : "-"}${Math.abs(i)}</option>`;
  return `<div class="r"><select id="off">${o}</select><button id="setband">${cur == null ? "That's my band" : "Change"}</button></div>
    <div class="m" style="margin-top:4px">Your band comes from your longitude, not a precise location. We guessed from your clock.</div>`;
}
function wireBand() { const b = $("#setband"); if (b) b.onclick = async () => { await api("band", { offset: +$("#off").value }); load("catch"); }; }

async function load(which) {
  if (which === "catch") return catchScreen(await api("today"));
  if (which === "payoff") return payoffScreen(await api("lap"));
  if (which === "planet") return planetScreen(await api("planet"));
}

function catchScreen(d) {
  palette = d.palette; $("#lapno").textContent = d.lap ? `Lap ${d.lap}` : "Not started";
  const el = $("#catch");
  if (!d.band) { el.innerHTML = `<div class="p"><p class="h">Find your band</p>${bandPicker(null)}</div>`; return wireBand(); }
  const w = d.window; let h = `<div class="p"><p class="h">Your dawn</p><div>${esc(d.band.label)}</div>`;
  if (!w.open) h += `<div class="m">Your window opens ${new Date(w.opensAt).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })} and stays open 2 hours.</div>`;
  else h += `<div class="m">Open until ${hm(w.closesAt)}.</div>` + (d.sky ? `<div style="margin-top:6px">Your sky (automatic): <b>${SKY[d.sky]}</b></div>` : "");
  h += `<div style="margin-top:8px">${bandPicker(d.band.offset)}</div></div>`;
  if (w.open && d.stamped) h += `<div class="p" style="border-color:#6be08a"><p class="h" style="color:#6be08a">Passed</p>You've passed the baton this lap. See how it ended tomorrow morning.</div>`;
  else if (w.open) {
    h += `<div class="p"><p class="h">From the band before you (the only line you can see)</p>` + (d.prev
      ? `<div class="r"><span class="sw" style="cursor:default;background:${hsl(palette[d.prev.color])}"></span><span class="m">their mood</span><span class="m">their sky: ${SKY[d.prev.sky] || "?"}</span></div><div class="r" style="margin-top:8px"><button id="hear">Play last note</button><span class="m">they left: ${d.prev.note || "silence"}</span></div>`
      : `<div class="m">Nobody has stamped yet this lap. You're first.</div>`) + `</div>`;
    h += `<div class="p"><p class="h">Your stamp</p><div class="m">Mood color</div><div class="r" style="gap:4px;margin:4px 0 10px">${palette.map((c, i) => `<button class="sw" data-c="${i}" title="${c.name}" style="background:${hsl(c)}"></button>`).join("")}</div>
      <div class="m">Note</div><div class="r" style="margin:4px 0 0">${d.notes.map((n) => `<button class="chip" data-n="${n}">${n[0].toUpperCase() + n.slice(1)}</button>`).join("")}</div></div>
      <button class="go" id="pass">Pass the baton west</button><div class="m">Every slot is optional. Your stamp seals when you pass it.</div><div class="m" id="msg"></div>`;
  }
  el.innerHTML = h; wireBand(); pick = { color: null, note: null };
  el.querySelectorAll("[data-c]").forEach((b) => b.onclick = () => { pick.color = pick.color === +b.dataset.c ? null : +b.dataset.c; el.querySelectorAll("[data-c]").forEach((x) => x.classList.toggle("on", +x.dataset.c === pick.color)); });
  el.querySelectorAll("[data-n]").forEach((b) => b.onclick = () => { pick.note = pick.note === b.dataset.n ? null : b.dataset.n; el.querySelectorAll("[data-n]").forEach((x) => x.classList.toggle("on", x.dataset.n === pick.note)); });
  const hear = $("#hear"); if (hear) hear.onclick = () => tone(d.prev && d.prev.note);
  const pass = $("#pass"); if (pass) pass.onclick = async () => { pass.disabled = true; const r = await api("stamp", pick); if (r.error) { $("#msg").textContent = r.error; pass.disabled = false; } else load("catch"); };
}

// resolve = a note that settles (down a fifth), tension = one that leans (up a tritone-ish); one short beep
function tone(note) {
  try { const a = new AudioContext(), o = a.createOscillator(), g = a.createGain();
    o.frequency.value = note === "resolve" ? 261.6 : note === "tension" ? 370 : 0; g.gain.value = note ? 0.15 : 0;
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + 0.6); } catch {}
}

function payoffScreen(l) {
  const el = $("#payoff");
  if (l.error) { el.innerHTML = `<div class="p"><p class="h">Yesterday's lap</p><div class="m">No finished lap yet. The first one closes about 25 hours after launch.</div></div>`; return; }
  $("#lapno").textContent = `Lap ${l.lap}`;
  const me = l.yours;
  el.innerHTML = `<div class="p"><p class="h">The lap</p><div class="r" style="gap:14px"><span><b>${l.held}</b> held</span><span><b>${l.bots}</b> bots</span><span><b>${l.unheld}</b> unheld</span></div>
    <div class="grad">${l.gradient.map((c) => `<i style="background:${hsl(palette[c])}"></i>`).join("")}</div><div class="m">${l.gradient.length} mood colors, in the order the baton moved</div>
    <div class="r" style="margin-top:8px"><button id="tune">Play the tune</button><span class="m">${l.tally.resolve} resolve · ${l.tally.tension} tension · ${l.tally.silent} silent</span></div>
    <div class="m" style="margin-top:6px">Sky along the lap: ${Object.entries(l.sky).map(([k, v]) => `${v} ${(SKY[k] || k).toLowerCase()}`).join(" · ") || "none"}</div></div>
    ${me ? `<div class="p" style="border-color:var(--gold)"><p class="h">Your stamp, ${esc(me.label)}</p>You chose <span class="sw" style="cursor:default;width:30px;height:14px;background:${hsl(palette[me.color])}"></span> ${me.note || "no note"}, under ${(SKY[me.sky] || "?").toLowerCase()} skies.<div class="m" style="margin-top:4px">Proof: fingerprint ${me.hash.slice(0, 4)}…${me.hash.slice(-4)}</div></div>` : ""}`;
  $("#tune").onclick = () => l.tune.forEach((n, i) => setTimeout(() => tone(n), i * 250));
}

function planetScreen(p) {
  const el = $("#planet");
  if (!p.bands || !p.bands.length) { el.innerHTML = `<div class="p"><p class="h">The planet</p><div class="m">The first lap hasn't started.</div></div>`; return; }
  $("#lapno").textContent = `Lap ${p.lap}`;
  const n = (s) => p.bands.filter((b) => b.status === s).length;
  el.innerHTML = `<div class="p"><p class="h">The baton right now</p><div class="m">${n("stamped") + n("bot")} of 24 bands have stamped · ${n("unheld")} unheld so far</div></div>
    <div class="p"><p class="h">24 solar bands</p><div class="grid">${p.bands.map((b) => `<div class="cell ${b.status}${b.mine ? " mine" : ""}" title="${b.status}">${b.label.replace("solar UTC", "")}</div>`).join("")}</div>
    <div class="m" style="margin-top:8px">Yellow: open now · blue: stamped · dark: unheld · green outline: you</div></div>`;
}
load("catch").then(() => api("today")).catch(() => {});
</script></body></html>
